<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f4">
<title>클사무관의 경제 터미널</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f7f4;--card:#fff;--line:#e4e9e4;--text:#111915;--muted:#6b766f;--green:#00a875;--blue:#3b6fd4;--amber:#d9962b;--red:#d45c62;--sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:760px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(245,247,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -14px;padding:0 14px}.topbar{display:flex;align-items:center;gap:12px;padding:12px 0 8px}.menu{display:flex;gap:8px;padding:2px 0 10px;overflow-x:auto;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.menu a{flex:none;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#44504a;font-size:16px;font-weight:700;text-decoration:none;letter-spacing:-.02em}.menu a.on{background:#e7f6ef;border-color:#c9eadb;color:#006b49}html{scroll-behavior:smooth}section{scroll-margin-top:calc(var(--hh,120px) + 4px)}
.topbar img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.topbar h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.04em;line-height:1.2;flex:1}
.stamp{flex:none;text-align:right;font-size:13px;color:var(--muted);line-height:1.3}
.stamp i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.stamp.old i{background:var(--amber)}
.notice{display:none;margin:12px 0 0;padding:11px 13px;border-radius:12px;background:#fff4e0;color:#8a5a00;font-size:14px}
.notice.on{display:block}
h2{margin:26px 2px 10px;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}.grid>.card:last-child:nth-child(odd){grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 12px 8px;min-width:0}
.head{display:flex;flex-direction:column;gap:1px}
.title{font-size:15px;font-weight:700;letter-spacing:-.03em}
.when{font-size:12px;color:var(--muted)}
.vals{display:flex;flex-direction:column;gap:0;margin:6px 0 0}
.big{font-size:28px;font-weight:900;letter-spacing:-.05em;line-height:1.1}
.big small{font-size:14px;font-weight:700;margin-left:2px;letter-spacing:-.02em}
.delta{font-size:13px;font-weight:500;color:var(--muted)}
.lg{font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:baseline;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;transform:translateY(0)}
.lg b{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.04em}
.lg b small{font-size:12px;font-weight:700;margin-left:1px}
.chart canvas{touch-action:pan-y!important;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.card.scrub{border-color:#b8dfcb}.chart{height:140px;margin-top:6px;position:relative}
.tv{height:190px;margin-top:2px}
.tv .tradingview-widget-container,.tv .tradingview-widget-container__widget{height:100%;width:100%}
.empty{padding:36px 0;text-align:center;color:var(--muted);font-size:15px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.foot img{display:block;margin:12px auto 4px;width:min(210px,60vw);height:auto}
.foot a{color:#008b5e;text-decoration:none;font-weight:500}
@media(min-width:900px){.app{max-width:1100px}.grid{grid-template-columns:1fr 1fr}.chart{height:210px}}
</style>
</head>
<body><div class="app">

<header class="top"><div class="topbar">
  <img src="https://raw.githubusercontent.com/lloydknam/eodigallae/main/icons/clerk.jpg" alt="">
  <h1>클사무관의<br>경제 터미널</h1>
  <div class="stamp" id="stamp"><i></i><span id="stampText">불러오는 중</span></div>
</div>
  <nav class="menu" id="menu" aria-label="카테고리"><a href="#fin" data-s="fin" class="on">금융</a><a href="#eco" data-s="eco">경제</a><a href="#mon" data-s="mon">통화·대외</a></nav>
</header>
<div class="notice" id="notice"></div>

<section id="fin"><h2>금융</h2>
<div class="grid" id="g-fin">
  <div class="card"><div class="head"><div class="title">코스피</div><div class="when">실시간</div></div>
    <div class="tv"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>{"symbol":"KRX:KOSPI","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"light","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":false}</script></div></div></div>
  <div class="card"><div class="head"><div class="title">S&amp;P 500</div><div class="when">실시간</div></div>
    <div class="tv"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>{"symbol":"FOREXCOM:SPXUSD","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"light","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":false}</script></div></div></div>
</div></section>

<section id="eco"><h2>경제</h2>
<div class="grid" id="g-real"></div></section>

<section id="mon"><h2>통화·대외</h2>
<div class="grid" id="g-money"></div></section>

<footer class="foot">
  한국은행 ECOS · 미국 FRED · TradingView · 정보 제공용
  <img src="https://raw.githubusercontent.com/lloydknam/korea-gdpnow/main/web/brand-lockup-light.svg" alt="Lloyd’s Balcony Lab">
  with claude · <a href="https://github.com/lloydknam">GitHub(@lloydknam)</a>
</footer>
</div>

<script>
/* ---------- 카드 정의 ---------- */
const C={g:'#00a875',b:'#3b6fd4',a:'#d9962b',r:'#d45c62'};
const fmt=(d,u)=>v=>Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d})+(u||'');
const CARDS=[
 {box:'g-fin',id:'fx',title:'원/달러 환율',freq:'D',win:'1y',type:'line',
  series:[{id:'731Y003',label:'원/달러',color:C.g}],val:fmt(1),unit:'원',delta:{mode:'diff',d:1,u:'원'}},
 {box:'g-fin',id:'rates',title:'국채금리 한·미',freq:'D',win:'1y',type:'line',
  series:[{id:'817Y002',label:'국고채 3년',color:C.g},{id:'DGS10',label:'미국 10년',color:C.b}],val:fmt(2),unit:'%'},
 {box:'g-money',id:'policy',title:'기준금리 한·미',freq:'M',win:'1y',type:'line',step:true,
  series:[{id:'722Y001',label:'한국',color:C.g},{id:'FEDFUNDS',label:'미국',color:C.b}],val:fmt(2),unit:'%'},

 {box:'g-real',id:'gdp',title:'실질GDP 성장률',freq:'Q',win:'8q',type:'bar',
  series:[{id:'200Y102',label:'성장률',color:C.g}],val:fmt(1),unit:'%',labels:fmt(1),labelAll:true},
 {box:'g-real',id:'cpi',title:'물가상승률(전년비)',freq:'M',win:'12m',type:'line',yoy:true,
  series:[{id:'901Y009',label:'한국',color:C.g},{id:'CPIAUCSL',label:'미국',color:C.b}],val:fmt(1),unit:'%'},
 {box:'g-real',id:'unemp',title:'실업률 한·미',freq:'M',win:'1y',type:'line',
  series:[{id:'901Y027:unemployment',label:'한국',color:C.g},{id:'UNRATE',label:'미국',color:C.b}],val:fmt(1),unit:'%'},
 {box:'g-real',id:'emp',title:'한국 고용률',freq:'M',win:'1y',type:'line',
  series:[{id:'901Y027:employment',label:'고용률',color:C.g}],val:fmt(1),unit:'%',delta:{mode:'diff',d:1,u:'%p'}},

 {box:'g-money',id:'ca',title:'경상수지',freq:'M',win:'12m',type:'bar',
  series:[{id:'301Y013',label:'경상수지',color:C.g}],scale:1/100,val:fmt(0),unit:'억$',labels:fmt(0),delta:{mode:'diff',d:0,u:'억$'}},
 {box:'g-money',id:'trade',title:'수출·수입지수',freq:'M',win:'1y',type:'line',
  series:[{id:'403Y001',label:'수출',color:C.g},{id:'403Y003',label:'수입',color:C.a}],val:fmt(0),unit:''},
 {box:'g-money',id:'hh',title:'가계신용',freq:'Q',win:'8q',type:'bar',
  series:[{id:'151Y001',label:'가계신용',color:C.a}],scale:1/1000,val:fmt(0),unit:'조원',labels:fmt(0),delta:{mode:'pct',d:1}},
 {box:'g-money',id:'m2',title:'M2 광의통화',freq:'M',win:'1y',type:'line',
  series:[{id:'161Y006',label:'M2',color:C.b}],scale:1/1000,val:fmt(0),unit:'조원',delta:{mode:'pct',d:1}},
 {box:'g-money',id:'usgdp',title:'미국 GDP',freq:'Q',win:'8q',type:'line',
  series:[{id:'GDP',label:'미국 GDP',color:C.b}],scale:1/1000,val:fmt(1),unit:'조$',delta:{mode:'pct',d:1}}
];
const ORDER=['fx','rates','gdp','cpi','unemp','emp','policy','m2','hh','ca','trade','usgdp'];CARDS.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));

/* ---------- 날짜 처리 ---------- */
const pad=n=>String(n).padStart(2,'0');
function norm(raw){
  const s=String(raw||'');
  if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  if(/^\d{6}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-01';
  const q=s.match(/^(\d{4})Q([1-4])$/);
  if(q)return q[1]+'-'+pad((Number(q[2])-1)*3+1)+'-01';
  return s.slice(0,10);
}
const shortLabel=(iso,f)=>{const y=iso.slice(2,4),m=Number(iso.slice(5,7)),d=Number(iso.slice(8,10));
  if(f==='D')return m+'.'+d; if(f==='M')return m===1?"'"+y+'.1':String(m)+'월'; return "'"+y+' '+Math.ceil(m/3)+'Q';};
const whenLabel=(iso,f)=>{const y=iso.slice(2,4),m=Number(iso.slice(5,7)),d=Number(iso.slice(8,10));
  if(f==='D')return m+'월 '+d+'일'; if(f==='M')return y+'년 '+m+'월'; return y+'년 '+Math.ceil(m/3)+'분기';};

/* ---------- 데이터 가공 ---------- */
function getSeries(data,id,spec){
  const all=[...(data.ecos||[]),...(data.fred||[])];
  const row=all.find(x=>x.series===id);
  if(!row||!Array.isArray(row.history))return [];
  let pts=row.history.map(p=>({t:norm(p.date),v:Number(p.value)})).filter(p=>Number.isFinite(p.v));
  if(spec.yoy){
    const byMonth=new Map(pts.map(p=>[p.t.slice(0,7),p.v]));
    pts=pts.map(p=>{const prev=byMonth.get((Number(p.t.slice(0,4))-1)+p.t.slice(4,7));return prev?{t:p.t,v:(p.v/prev-1)*100}:null}).filter(Boolean);
  }
  if(spec.scale)pts=pts.map(p=>({t:p.t,v:p.v*spec.scale}));
  const w=spec.win;
  if(w==='1y'){const c=new Date();c.setFullYear(c.getFullYear()-1);const cut=c.toISOString().slice(0,10);pts=pts.filter(p=>p.t>=cut);}
  else if(w==='12m'&&pts.length){const l=pts[pts.length-1].t;const c=new Date(l.slice(0,4),Number(l.slice(5,7))-12,1);const cut=c.getFullYear()+'-'+pad(c.getMonth()+1)+'-01';pts=pts.filter(p=>p.t>cut);}
  else if(w==='8q')pts=pts.slice(-8);
  return pts;
}

/* ---------- 렌더 ---------- */
const charts={};const FS=window.innerWidth<600?11:13;
const barLabels={id:'barLabels',afterDatasetsDraw(chart,_a,opts){
  if(!opts||!opts.fmt)return;const {ctx}=chart;ctx.save();ctx.font='700 10px '+getComputedStyle(document.body).fontFamily;ctx.fillStyle='#3d4a42';ctx.textAlign='center';
  chart.getDatasetMeta(0).data.forEach((bar,i)=>{const v=chart.data.datasets[0].data[i];if(v==null)return;const n=chart.data.datasets[0].data.length,txt=opts.fmt(v);if(window.innerWidth<600&&i!==n-1&&!opts.all)return;const up=v>=0;ctx.textBaseline=up?'bottom':'top';ctx.fillText(opts.fmt(v),bar.x,up?bar.y-3:bar.y+3);});ctx.restore();}};

const dk=h=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*.78).toString(16).padStart(2,'0')).join('');
const cross={id:'cross',afterDatasetsDraw(chart){
  const a=chart.getActiveElements();if(!a.length||chart.config.type==='bar')return;
  const x=a[0].element.x,{top,bottom}=chart.chartArea,c=chart.ctx;
  c.save();c.strokeStyle='#8d9a92';c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(x,top);c.lineTo(x,bottom);c.stroke();c.restore();}};
const prevIdx=(arr,i)=>{for(let k=Math.min(i,arr.length-1);k>=0;k--)if(arr[k]!=null)return k;return -1;};
function valsInner(spec,sets,arrs,idx,exact){
  const cell=i=>{const arr=arrs[i];const k=exact?(arr[idx]!=null?idx:-1):prevIdx(arr,idx);if(k<0)return null;const kp=prevIdx(arr,k-1);return {v:arr[k],prev:kp>=0?arr[kp]:null};};
  const u=spec.unit?'<small>'+spec.unit+'</small>':'';
  if(sets.length===1){
    const c=cell(0);if(!c)return '<span class="big">—</span>';
    let delta='';
    if(spec.delta&&c.prev!=null){
      const dv=spec.delta.mode==='pct'?(c.v/c.prev-1)*100:c.v-c.prev;
      const arrow=dv>0?'▲':dv<0?'▼':'–';
      const d=Math.abs(dv).toLocaleString('ko-KR',{maximumFractionDigits:spec.delta.d??1,minimumFractionDigits:spec.delta.d??1});
      delta='<span class="delta">'+arrow+' '+d+(spec.delta.mode==='pct'?'%':spec.delta.u||'')+'</span>';
    }
    return '<span class="big">'+spec.val(c.v)+u+'</span>'+delta;
  }
  return sets.map((s,i)=>{const c=cell(i);return '<span class="lg"><i style="background:'+s.color+'"></i>'+s.label+' <b>'+(c?spec.val(c.v)+u:'—')+'</b></span>';}).join('');
}

const resets={};
function drawCard(spec,data){
  const host=document.getElementById(spec.box);
  let el=document.getElementById('c-'+spec.id);
  if(!el){el=document.createElement('div');el.className='card';el.id='c-'+spec.id;host.appendChild(el);}
  if(charts[spec.id]){charts[spec.id].destroy();delete charts[spec.id];}
  delete resets[spec.id];
  const sets=spec.series.map(s=>({...s,pts:getSeries(data,s.id,spec)})).filter(s=>s.pts.length);
  if(!sets.length){el.innerHTML='<div class="head"><div class="title">'+spec.title+'</div></div><div class="empty">데이터 수집 대기</div>';return;}
  const labels=[...new Set(sets.flatMap(s=>s.pts.map(p=>p.t)))].sort();
  const single=sets.length===1,isBar=spec.type==='bar';
  const arrs=sets.map(s=>{const m=new Map(s.pts.map(p=>[p.t,p.v]));return labels.map(t=>m.has(t)?m.get(t):null);});
  const lastLabel=sets[0].pts[sets[0].pts.length-1].t;
  el.innerHTML='<div class="head"><div class="title">'+spec.title+'</div><div class="when"></div></div><div class="vals"></div><div class="chart"><canvas></canvas></div>';
  const whenEl=el.querySelector('.when'),valsEl=el.querySelector('.vals');
  const reset=()=>{whenEl.textContent=whenLabel(lastLabel,spec.freq);valsEl.innerHTML=valsInner(spec,sets,arrs,labels.length-1,false);el.classList.remove('scrub');const ch=charts[spec.id];if(ch&&ch.getActiveElements().length){ch.setActiveElements([]);ch.update('none');}};
  const show=idx=>{whenEl.textContent=whenLabel(labels[idx],spec.freq);valsEl.innerHTML=valsInner(spec,sets,arrs,idx,true);el.classList.add('scrub');};
  reset();resets[spec.id]=reset;
  const datasets=sets.map((s,i)=>{const arr=arrs[i];
    if(isBar)return {data:arr,backgroundColor:arr.map(v=>v!=null&&v<0?C.r:s.color),hoverBackgroundColor:arr.map(v=>dk(v!=null&&v<0?C.r:s.color)),borderRadius:6,maxBarThickness:34};
    return {label:s.label,data:arr,borderColor:s.color,backgroundColor:s.color+'22',borderWidth:3,pointRadius:0,pointHitRadius:14,pointHoverRadius:6,pointHoverBackgroundColor:s.color,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2,tension:spec.step?0:.25,stepped:spec.step?'before':false,spanGaps:true,fill:single};});
  const canvas=el.querySelector('canvas');
  const tick={color:'#5f6b64',font:{size:FS,family:getComputedStyle(document.body).fontFamily}};
  charts[spec.id]=new Chart(canvas,{type:isBar?'bar':'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:isBar?18:4}},
      events:['mousemove','mouseout','click','touchstart','touchmove'],
      interaction:{mode:'index',intersect:false,axis:'x'},
      onHover:(evt,els)=>{if(els&&els.length)show(els[0].index);else reset();},
      plugins:{legend:{display:false},tooltip:{enabled:false},barLabels:{fmt:isBar?spec.labels:null,all:!!spec.labelAll}},
      scales:{x:{ticks:{...tick,maxTicksLimit:4,maxRotation:0,autoSkip:true,callback(v){return shortLabel(this.getLabelForValue(v),spec.freq);}},grid:{display:false},border:{display:false}},
              y:{ticks:{...tick,maxTicksLimit:4,callback:v=>Number(v).toLocaleString('ko-KR',{maximumFractionDigits:1})},grid:{color:'#edf1ed'},border:{display:false},position:'right'}}},
    plugins:[barLabels,cross]});
  canvas.addEventListener('mouseleave',reset);
}
/* 다른 곳을 터치하면 선택 해제 */
document.addEventListener('touchstart',e=>{Object.keys(resets).forEach(id=>{const c=document.getElementById('c-'+id);if(c&&!c.contains(e.target))resets[id]();});},{passive:true,capture:true});

/* ---------- 상태 표시 ---------- */
function showStatus(data){
  const t=data.updated_at_utc?new Date(data.updated_at_utc):null;
  const stamp=document.getElementById('stamp');
  if(t&&!Number.isNaN(t.getTime())){
    const hours=(Date.now()-t.getTime())/3600000;
    const k=new Date(t.getTime()+9*3600000);
    document.getElementById('stampText').textContent=(k.getUTCMonth()+1)+'/'+k.getUTCDate()+' '+pad(k.getUTCHours())+':'+pad(k.getUTCMinutes())+' 갱신';
    stamp.classList.toggle('old',hours>30);
  }
  const bad=[];
  if(data.ecos_status&&data.ecos_status!=='OK')bad.push('한국은행 일부 지연');
  if(data.fred_status&&data.fred_status!=='OK')bad.push('FRED 일부 지연');
  const n=document.getElementById('notice');
  n.textContent=bad.length?bad.join(' · ')+' — 직전 수집값 표시 중':'';
  n.classList.toggle('on',bad.length>0);
}

/* ---------- 카테고리 메뉴 ---------- */
const menuLinks=[...document.querySelectorAll('#menu a')];
function spy(){
  const top=document.querySelector('.top');const hh=top.offsetHeight;
  document.documentElement.style.setProperty('--hh',hh+'px');
  let cur='fin';
  ['fin','eco','mon'].forEach(id=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<=hh+30)cur=id;});
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur='mon';
  menuLinks.forEach(a=>a.classList.toggle('on',a.dataset.s===cur));
}
let spyTick=false;
addEventListener('scroll',()=>{if(!spyTick){spyTick=true;requestAnimationFrame(()=>{spyTick=false;spy();});}},{passive:true});
addEventListener('resize',spy);spy();

let lastLoad=0;
async function load(){
  try{
    const res=await fetch('./data/official-macro.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw Error('HTTP '+res.status);
    const data=await res.json();
    showStatus(data);
    CARDS.forEach(c=>drawCard(c,data));
    lastLoad=Date.now();
  }catch(err){
    const n=document.getElementById('notice');n.textContent='데이터를 불러오지 못했습니다 ('+err.message+'). 새로고침해 주세요.';n.classList.add('on');
  }
}
