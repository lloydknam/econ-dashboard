name: Refresh official macro data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_official_macro.py"
      - "config/ecos-series.json"
      - "config/fred-series.json"
      - ".github/workflows/refresh-official-macro.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: official-macro-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect FRED and ECOS observations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          ECOS_SERIES_JSON: ${{ vars.ECOS_SERIES_JSON }}
        run: python scripts/collect_official_macro.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-macro.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official macroeconomic data"
            # Rebase onto the latest main if a concurrent repository update landed
            # while the collector was running. Prefer this run's freshly collected
            # observation file if the same generated file changed concurrently.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to push refreshed data after three attempts" >&2
            exit 1
          fi
